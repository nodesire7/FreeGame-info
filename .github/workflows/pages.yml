name: Build & Deploy (FreeGame-info)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 所有触发都运行：抓取最新限免数据并部署到 GitHub Pages ──────────────────
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Prepare history store (branch: history)"
        shell: bash
        run: |
          set -e
          if git ls-remote --exit-code origin history >/dev/null 2>&1; then
            git fetch origin history:history
          else
            git branch history
          fi
          git worktree add history-wt history
          mkdir -p history-wt/history/records

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-

      - name: Install Playwright (Chromium)
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate site
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          ITAD_COUNTRY: ${{ secrets.ITAD_COUNTRY || 'CN' }}
        run: |
          mkdir -p site
          python main.py site --history-dir history-wt/history
          touch site/.nojekyll

      - name: Prepare public files and mark the release
        run: |
          cp ads.txt site/ads.txt
          python3 - <<'PYMARK'
          import os
          from pathlib import Path
          release = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          tag = f'<meta name="freegame-build" content="{release}">'
          for page in (Path("site/index.html"), Path("site/history/index.html")):
              html = page.read_text(encoding="utf-8")
              assert html.count("</head>") == 1
              page.write_text(html.replace("</head>", tag + "</head>"), encoding="utf-8")
          PYMARK
          echo "gameinfo.gbtgame.me" > site/CNAME

      - name: Persist history store (only when changed)
        shell: bash
        run: |
          set -e
          cd history-wt
          git add -f history
          if ! git diff --cached --quiet -- history; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update history store"
            git push origin HEAD:history
          else
            echo "No history changes."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out the account Pages repository
        if: github.repository == 'nodesire7/FreeGame-info'
        uses: actions/checkout@v4
        with:
          repository: nodesire7/nodesire7.github.io
          ref: main
          path: account-pages
          ssh-key: ${{ secrets.ROOT_PAGES_DEPLOY_KEY }}

      - name: Publish the same build to the account site
        if: github.repository == 'nodesire7/FreeGame-info'
        shell: bash
        run: |
          bash deploy/sync-account-pages.sh site account-pages
          cd account-pages
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync FreeGame-info ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
            git push origin HEAD:main
          fi

      - name: Verify both public sites serve this build
        if: github.repository == 'nodesire7/FreeGame-info'
        shell: bash
        run: |
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="<meta name=\"freegame-build\" content=\"$release\">"
          snapshot='%E7%99%BD%E5%AB%96%E4%BF%A1%E6%81%AF.json'
          matches() {
            curl -fsSL --connect-timeout 5 --max-time 15 "$1" -o "$RUNNER_TEMP/pages-check" &&
              cmp -s "$RUNNER_TEMP/pages-check" "$2"
          }
          has_release_marker() {
            curl -fsSL --connect-timeout 5 --max-time 15 "$1" -o "$RUNNER_TEMP/pages-check" &&
              grep -Fq "$marker" "$RUNNER_TEMP/pages-check"
          }
          for attempt in {1..36}; do
            if matches "https://nodesire7.github.io/" account-pages/index.html &&
               matches "https://nodesire7.github.io/$snapshot" 'site/白嫖信息.json' &&
               has_release_marker "https://gameinfo.gbtgame.me/" &&
               has_release_marker "https://gameinfo.gbtgame.me/history/" &&
               matches "https://gameinfo.gbtgame.me/$snapshot" 'site/白嫖信息.json'; then
              echo "Both public sites serve the new build."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the two public Pages deployments." >&2
          exit 1

  # ── 仅代码 push 时运行：构建 Docker 镜像并创建 GitHub Release ─────────────
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            next="v1.0"
          else
            if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              next="v${major}.$((minor+1))"
            else
              next="v1.0"
            fi
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $next"

      - name: Package deploy scripts for Release
        shell: bash
        run: |
          rm -f deploy.zip deploy.tar.gz || true
          rm -f deploy/env || true
          cp deploy/env.example deploy/env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.version.outputs.tag }}/" deploy/env
          zip -r deploy.zip deploy
          tar -czf deploy.tar.gz deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            deploy.zip
            deploy.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodesire77/game_info:latest
            nodesire77/game_info:${{ steps.version.outputs.tag }}
